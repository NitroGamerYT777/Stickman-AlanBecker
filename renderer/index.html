<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Stickman Desktop</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="ui">
    <div>
      <label>Rang: <input type="color" id="colorPicker" value="#0b66ff"></label>
      <button id="drawBtn">Chiz</button>
      <button id="doneDrawingBtn" style="display:none;">Chizib Boldim</button>
      <button id="startRiggingBtn" style="display:none;">Rigging Boshlash</button>
      <input id="nameInput" placeholder="Stickman nomi">
    </div>
    <div id="rigging-panel" style="display:none;">
      <span>Rigging Mode:</span>
      <button class="rig-joint-btn" data-joint="head">Bosh</button>
      <button class="rig-joint-btn" data-joint="hand">Qo'l</button>
      <button class="rig-joint-btn" data-joint="foot">Oyoq</button>
      <button id="finalizeRigBtn">Yakunlash</button>
    </div>
    <div>
      <button id="toggleInteract">Interaction: ON</button>
      <button id="spawnDemo">Spawn Demo</button>
    </div>
    <div id="notes">Hover your mouse near a stickman to interact.</div>
  </div>

  <canvas id="world"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
